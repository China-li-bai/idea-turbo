countries:
  vietnam:
    name: "越南"
    code: "VN"
    language: "vi"
    currency: "VND"
    timezone: "Asia/Ho_Chi_Minh"
    
    primary_channels:
      - name: "Zalo"
        penetration: "70%"
        priority: 1
        features:
          - "越南国民级应用，类似微信"
          - "支持公众号(OA)和私信"
          - "企业可申请官方账号"
        limitations:
          - "新号每天只能加 20-30 人"
          - "群发需要官方账号权限"
        automation:
          method: "zalo_oa_api"
          daily_limit: 100
          requires_verification: true
          
      - name: "WhatsApp"
        penetration: "45%"
        priority: 2
        features:
          - "商务沟通常用"
          - "支持 WhatsApp Business API"
        limitations:
          - "新号限制严格"
          - "被举报易封号"
        automation:
          method: "whatsapp_business_api"
          daily_limit: 50
          requires_verification: true
    
    business_culture:
      greeting_style: "正式但友好，喜欢称呼先生/女士"
      decision_speed: "中等，需要建立信任"
      price_sensitivity: "高，极度价格敏感"
      preferred_contact_time: "09:00-11:30, 14:00-17:00"
      response_expectation: "24小时内回复"
      negotiation_style: "喜欢讨价还价，需要留有余地"
      trust_factors:
        - "公司资质和证书"
        - "样品测试"
        - "本地客户案例"
    
    keywords:
      - "Cửa hàng máy tính"
      - "Laptop"
      - "SSD"
      - "Ổ cứng"
      - "Linh kiện máy tính"
    
    search_queries:
      - "Cửa hàng máy tính Hồ Chí Minh"
      - "Laptop Hà Nội"
      - "Linh kiện máy tính Đà Nẵng"
      - "Sửa chữa máy tính"

  russia:
    name: "俄罗斯"
    code: "RU"
    language: "ru"
    currency: "RUB"
    timezone: "Europe/Moscow"
    
    primary_channels:
      - name: "Telegram"
        penetration: "70%"
        priority: 1
        features:
          - "俄罗斯国民级应用"
          - "支持频道和群组营销"
          - "Bot API 完善开放"
        limitations:
          - "需要 VPN（部分区域）"
          - "用户隐私意识强"
        automation:
          method: "telegram_bot_api"
          daily_limit: 200
          requires_verification: false
          
      - name: "VK"
        penetration: "60%"
        priority: 2
        features:
          - "俄罗斯最大社交网络"
          - "支持企业页面和广告"
          - "可搜索用户和群组"
        limitations:
          - "需要手机号注册"
          - "新号限制较多"
        automation:
          method: "vk_api"
          daily_limit: 100
          requires_verification: true
          
      - name: "WhatsApp"
        penetration: "30%"
        priority: 3
        note: "2025年起可能被禁用，需关注政策"
        features:
          - "部分商务人士使用"
        limitations:
          - "政策风险高"
          - "可能被 Max Messenger 取代"
        automation:
          method: "whatsapp_business_api"
          daily_limit: 30
          requires_verification: true
    
    business_culture:
      greeting_style: "正式，使用名字+父名"
      decision_speed: "较慢，需要多轮沟通"
      price_sensitivity: "中等，重视质量"
      preferred_contact_time: "10:00-13:00, 14:00-18:00"
      response_expectation: "48小时内回复"
      negotiation_style: "直接，不喜欢绕弯子"
      trust_factors:
        - "产品质量认证"
        - "长期合作承诺"
        - "技术支持能力"
    
    keywords:
      - "Компьютерный магазин"
      - "SSD накопитель"
      - "Жесткий диск"
      - "Комплектующие"
    
    search_queries:
      - "Компьютерный магазин Москва"
      - "SSD накопитель Санкт-Петербург"
      - "Комплектующие для ПК"

  indonesia:
    name: "印度尼西亚"
    code: "ID"
    language: "id"
    currency: "IDR"
    timezone: "Asia/Jakarta"
    
    primary_channels:
      - name: "WhatsApp"
        penetration: "85%"
        priority: 1
        features:
          - "国民级应用，几乎人人使用"
          - "商务沟通首选"
          - "支持 WhatsApp Business"
        limitations:
          - "新号限制严格"
          - "群发易被举报"
        automation:
          method: "whatsapp_business_api"
          daily_limit: 50
          requires_verification: true
          
      - name: "Instagram"
        penetration: "60%"
        priority: 2
        features:
          - "年轻用户为主"
          - "适合品牌展示"
          - "Direct Message 可触达"
        limitations:
          - "DM 有每日限制"
          - "需要内容运营"
        automation:
          method: "instagram_api"
          daily_limit: 30
          requires_verification: true
    
    business_culture:
      greeting_style: "友好热情，喜欢闲聊"
      decision_speed: "较慢，需要建立关系"
      price_sensitivity: "高，极度价格敏感"
      preferred_contact_time: "09:00-12:00, 13:00-17:00"
      response_expectation: "24小时内回复"
      negotiation_style: "喜欢讨价还价，注重人情"
      trust_factors:
        - "本地代理或分销商"
        - "样品测试"
        - "付款灵活性"
    
    keywords:
      - "Toko komputer"
      - "Laptop"
      - "SSD"
      - "Hardisk"
      - "Sparepart komputer"
    
    search_queries:
      - "Toko komputer Jakarta"
      - "Sparepart komputer Surabaya"
      - "Laptop Bandung"

  thailand:
    name: "泰国"
    code: "TH"
    language: "th"
    currency: "THB"
    timezone: "Asia/Bangkok"
    
    primary_channels:
      - name: "LINE"
        penetration: "85%"
        priority: 1
        features:
          - "泰国国民级应用"
          - "支持 LINE OA 企业账号"
          - "可发送富媒体消息"
        limitations:
          - "OA 需要付费"
          - "新号限制"
        automation:
          method: "line_messaging_api"
          daily_limit: 100
          requires_verification: true
          
      - name: "WhatsApp"
        penetration: "40%"
        priority: 2
        features:
          - "商务人士常用"
          - "跨境沟通首选"
        limitations:
          - "不如 LINE 普及"
        automation:
          method: "whatsapp_business_api"
          daily_limit: 50
          requires_verification: true
    
    business_culture:
      greeting_style: "礼貌，使用敬语(ครับ/ค่ะ)"
      decision_speed: "较慢，需要建立关系"
      price_sensitivity: "中等，重视性价比"
      preferred_contact_time: "09:00-12:00, 13:00-17:00"
      response_expectation: "24小时内回复"
      negotiation_style: "温和，不喜欢冲突"
      trust_factors:
        - "产品质量"
        - "售后服务"
        - "本地客户推荐"
    
    keywords:
      - "ร้านคอมพิวเตอร์"
      - "SSD"
      - "ฮาร์ดดิสก์"
      - "อุปกรณ์คอมพิวเตอร์"
    
    search_queries:
      - "ร้านคอมพิวเตอร์ กรุงเทพ"
      - "SSD ฮาร์ดดิสก์"

  malaysia:
    name: "马来西亚"
    code: "MY"
    language: "ms"
    secondary_language: "en"
    currency: "MYR"
    timezone: "Asia/Kuala_Lumpur"
    
    primary_channels:
      - name: "WhatsApp"
        penetration: "80%"
        priority: 1
        features:
          - "国民级应用"
          - "商务沟通首选"
          - "英语沟通普遍"
        limitations:
          - "新号限制"
        automation:
          method: "whatsapp_business_api"
          daily_limit: 50
          requires_verification: true
          
      - name: "WeChat"
        penetration: "50%"
        priority: 2
        features:
          - "华人社区常用"
          - "支持公众号"
        limitations:
          - "主要限于华人群体"
        automation:
          method: "wechat_work_api"
          daily_limit: 50
          requires_verification: true
    
    business_culture:
      greeting_style: "正式，英语沟通为主"
      decision_speed: "中等"
      price_sensitivity: "中等"
      preferred_contact_time: "09:00-12:00, 14:00-17:00"
      response_expectation: "24小时内回复"
      negotiation_style: "直接但礼貌"
      trust_factors:
        - "公司资质"
        - "产品认证"
        - "本地案例"
    
    keywords:
      - "Computer shop"
      - "SSD"
      - "Hard disk"
      - "Computer parts"
    
    search_queries:
      - "Computer shop Kuala Lumpur"
      - "Computer parts Penang"
      - "SSD supplier Malaysia"

global_settings:
  anti_ban:
    daily_message_limit_per_account: 50
    min_interval_seconds: 30
    max_interval_seconds: 120
    account_rotation: true
    warmup_period_days: 7
    
  follow_up:
    first_follow_up_days: 3
    second_follow_up_days: 7
    third_follow_up_days: 14
    max_follow_ups: 3
    
  working_hours:
    start: "09:00"
    end: "18:00"
    timezone_aware: true
