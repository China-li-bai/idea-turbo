<!doctype html>
<html class="dark" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Make Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
    <style>
        body {
          /* min-height: max(884px, 100dvh); */
          /* iOS 14 兼容性修复 */
          -webkit-text-size-adjust: 100%;
          -webkit-tap-highlight-color: transparent;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }
        
        /* iOS 14 兼容性修复 */
        @supports not (min-height: 100dvh) {
          body {
            min-height: -webkit-fill-available;
          }
        }
        
        /* iOS 14 兼容性修复：处理 flex 布局问题 */
        @supports not (display: flex) {
          .flex {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
          }
        }
    </style>
    <!-- iOS 14 兼容性 polyfills -->
    <script>
      // 检测 iOS 14 并添加必要的 polyfills
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        const version = navigator.userAgent.match(/OS (\d+)_(\d+)_?(\d+)?/);
        if (version && parseInt(version[1]) === 14) {
          // 添加 CSS 变量 polyfill
          if (!window.CSS || !window.CSS.supports || !window.CSS.supports('color', 'var(--test)')) {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/css-vars-ponyfill@2.4.8/dist/css-vars-ponyfill.min.js';
            script.onload = function() {
              cssVars({
                watch: true,
                onlyLegacy: false
              });
            };
            document.head.appendChild(script);
          }
        }
      }
    </script>
  </head>

  <body class="font-display bg-background dark:bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
