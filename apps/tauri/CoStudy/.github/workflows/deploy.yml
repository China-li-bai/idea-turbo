name: CI/CD Deploy to VPS (mgai.66666618.xyz)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Archive dist as tar.gz
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: dist.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: .

      - name: Copy dist tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist.tar.gz"
          target: "/tmp/"

      - name: Deploy on VPS (extract + Nginx config + reload)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_NAME="make-gold"
            
            # 设置部署路径 - 替换为您的实际路径
            WEBROOT="${{ secrets.WEBROOT }}"
            if [ -z "$WEBROOT" ]; then
              WEBROOT="/var/www/${APP_NAME}/dist"
            fi

            TAR="/tmp/dist.tar.gz"
            APP_DIR=$(dirname "$WEBROOT")

            echo "[INFO] Deploying to: $WEBROOT"
            sudo mkdir -p "$WEBROOT"
            sudo mkdir -p "$APP_DIR/backup"

            # 备份当前版本（如有）
            if [ -n "$(ls -A "$WEBROOT" 2>/dev/null)" ]; then
              TS=$(date +%Y%m%d-%H%M%S)
              sudo tar -czf "$APP_DIR/backup/${APP_NAME}-${TS}.tar.gz" -C "$WEBROOT" . || true
              echo "[INFO] Backed up current version to ${APP_DIR}/backup/${APP_NAME}-${TS}.tar.gz"
            fi

            # 解压新版本
            sudo tar -xzf "$TAR" -C "$WEBROOT"
            echo "[INFO] Files extracted successfully"

            # 设置正确的文件权限
            sudo chown -R www-data:www-data "$WEBROOT"
            sudo chmod -R 755 "$WEBROOT"

            # 清理临时文件
            rm -f "$TAR"
            echo "[INFO] Deployment completed successfully!"
            
            echo "[INFO] Please configure nginx manually using the provided nginx.conf.file"
