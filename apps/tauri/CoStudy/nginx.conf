server {
    listen 80;
    server_name mgai.66666618.xyz;
    
    # 替换为您的实际webroot路径，例如：/var/www/make-gold/dist
    root /var/www/make-gold/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 安全头
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header X-XSS-Protection '1; mode=block' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header Referrer-Policy 'no-referrer-when-downgrade' always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }

    # 健康检查
    location /health {
        try_files /health.html =404;
        access_log off;
    }

    # API代理（如果需要）
    location /api/ {
        try_files $uri $uri/ =404;
    }

    # SPA 路由 - 所有路径都重定向到index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 404 /index.html;
    
    # 日志
    access_log /var/log/nginx/make-gold.access.log;
    error_log /var/log/nginx/make-gold.error.log;
}