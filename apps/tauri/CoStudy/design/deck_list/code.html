<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Decks - Learning App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#007AFF", // Updated to match Apple's blue
              "background-light": "#F5F5F7",
              "background-dark": "#101622",
              "text-light-primary": "#1D1D1F",
              "text-light-secondary": "#8A8A8E",
              "text-dark-primary": "#F5F5F7",
              "text-dark-secondary": "#8A8A8E",
              "card-light": "#FFFFFF",
              "card-dark": "#1C2433",
              "progress-bar-light": "#E5E5EA",
              "progress-bar-dark": "#3A3A3C"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.5rem", // Adjusted for a slightly softer look
              "lg": "0.75rem",
              "xl": "1rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex h-16 items-center justify-between bg-background-light/80 px-4 py-2 backdrop-blur-sm dark:bg-background-dark/80">
<button class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full text-text-light-secondary dark:text-text-dark-secondary">
<span class="material-symbols-outlined text-2xl">settings</span>
</button>
<h1 class="text-lg font-semibold text-text-light-primary dark:text-text-dark-primary">Decks</h1>
<button class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full text-primary">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</header>
<!-- Main Content: Deck List -->
<main class="flex-1 space-y-3 px-4 py-4 pb-24">
<!-- Deck Card 1 -->
<div class="flex cursor-pointer flex-col gap-3 rounded-lg bg-card-light p-4 shadow-sm transition-all hover:bg-zinc-50 dark:bg-card-dark dark:hover:bg-gray-800/50">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<p class="text-base font-semibold text-text-light-primary dark:text-text-dark-primary">Spanish Vocabulary</p>
<p class="text-sm font-normal text-text-light-secondary dark:text-text-dark-secondary">10 New, 5 Review</p>
</div>
<button class="text-text-light-secondary dark:text-text-dark-secondary">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="flex items-center gap-3">
<div class="h-1.5 w-full overflow-hidden rounded-full bg-progress-bar-light dark:bg-progress-bar-dark">
<div class="h-full rounded-full bg-primary" style="width: 73.86%;"></div>
</div>
</div>
</div>
<!-- Deck Card 2 -->
<div class="flex cursor-pointer flex-col gap-3 rounded-lg bg-card-light p-4 shadow-sm transition-all hover:bg-zinc-50 dark:bg-card-dark dark:hover:bg-gray-800/50">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<p class="text-base font-semibold text-text-light-primary dark:text-text-dark-primary">Advanced Calculus</p>
<p class="text-sm font-normal text-text-light-secondary dark:text-text-dark-secondary">20 New, 15 Review</p>
</div>
<button class="text-text-light-secondary dark:text-text-dark-secondary">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="flex items-center gap-3">
<div class="h-1.5 w-full overflow-hidden rounded-full bg-progress-bar-light dark:bg-progress-bar-dark">
<div class="h-full rounded-full bg-primary" style="width: 28.40%;"></div>
</div>
</div>
</div>
<!-- Deck Card 3 -->
<div class="flex cursor-pointer flex-col gap-3 rounded-lg bg-card-light p-4 shadow-sm transition-all hover:bg-zinc-50 dark:bg-card-dark dark:hover:bg-gray-800/50">
<div class="flex items-start justify-between">
<div class="flex flex-col">
<p class="text-base font-semibold text-text-light-primary dark:text-text-dark-primary">UI Design Principles</p>
<p class="text-sm font-normal text-text-light-secondary dark:text-text-dark-secondary">5 New, 30 Review</p>
</div>
<button class="text-text-light-secondary dark:text-text-dark-secondary">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<div class="flex items-center gap-3">
<div class="h-1.5 w-full overflow-hidden rounded-full bg-progress-bar-light dark:bg-progress-bar-dark">
<div class="h-full rounded-full bg-primary" style="width: 90.90%;"></div>
</div>
</div>
</div>
<!-- Empty State -->
<div class="flex h-64 flex-col items-center justify-center rounded-lg border border-dashed border-gray-300 bg-card-light/50 p-6 text-center dark:border-gray-700 dark:bg-card-dark/50">
<div class="flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-4xl">style</span>
</div>
<h3 class="mt-4 text-base font-semibold text-text-light-primary dark:text-text-dark-primary">Your learning journey starts here.</h3>
<p class="mt-1 text-sm text-text-light-secondary dark:text-text-dark-secondary">Tap the <span class="material-symbols-outlined !text-sm !font-normal">add</span> button to create your first deck.</p>
</div>
</main>
<!-- Floating Action Button (FAB) -->
<div class="fixed bottom-6 right-6">
<button class="flex h-14 w-14 max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-primary text-white shadow-lg transition-transform hover:scale-105">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</div>
</body></html>
