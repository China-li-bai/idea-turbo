<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flashcard Review Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007AFF",
                        "background-light": "#F5F5F7",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-50">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<header class="flex flex-col pt-4 px-4">
<div class="flex items-center justify-between gap-4">
<div class="flex-1">
<h2 class="text-slate-600 dark:text-slate-400 text-sm font-medium leading-tight tracking-[-0.01em]">Strategic Execution</h2>
</div>
<div class="flex items-center justify-end">
<button class="flex items-center justify-center rounded-lg h-10 w-10 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700/50">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2 pt-2">
<div class="flex items-center justify-between">
<p class="text-slate-500 dark:text-slate-400 text-xs font-normal leading-normal">cards reviewed</p>
<p class="text-slate-500 dark:text-slate-400 text-xs font-normal leading-normal">15/50</p>
</div>
<div class="rounded-full bg-slate-300 dark:bg-slate-700 h-1">
<div class="h-1 rounded-full bg-primary" style="width: 30%;"></div>
</div>
</div>
</header>
<main class="flex flex-col flex-1 justify-center items-center p-4">
<div class="w-full flex flex-col items-center text-center">
<div class="w-full flex-grow flex items-center justify-center">
<h1 class="text-slate-900 dark:text-slate-50 tracking-tight text-3xl md:text-4xl font-bold leading-tight px-4 text-center">What is the primary design philosophy attributed to Steve Jobs?</h1>
</div>
<div class="w-full mt-8">
<div class="border-b border-slate-200 dark:border-slate-700 w-1/4 mx-auto mb-6"></div>
<p class="text-slate-800 dark:text-slate-200 text-lg md:text-xl font-normal leading-normal pb-3 pt-1 px-4 text-center">Simplicity and the removal of the superfluous.</p>
</div>
</div>
</main>
<footer class="p-4 pb-6">
<div class="flex flex-col items-center gap-4">
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-normal text-center">How well did you recall?</p>
<div class="grid grid-cols-4 gap-3 w-full max-w-md">
<button class="flex flex-col items-center justify-center rounded-lg py-2 transition-colors bg-red-500/20 text-red-400 hover:bg-red-500/30">
<span class="text-xs font-medium">Again</span>
</button>
<button class="flex flex-col items-center justify-center rounded-lg py-2 transition-colors bg-orange-500/20 text-orange-400 hover:bg-orange-500/30">
<span class="text-xs font-medium">Hard</span>
</button>
<button class="flex flex-col items-center justify-center rounded-lg py-2 transition-colors bg-green-500/20 text-green-400 hover:bg-green-500/30">
<span class="text-xs font-medium">Good</span>
</button>
<button class="flex flex-col items-center justify-center rounded-lg py-2 transition-colors bg-blue-500/20 text-blue-400 hover:bg-blue-500/30">
<span class="text-xs font-medium">Easy</span>
</button>
</div>
</div>
</footer>
</div>

</body></html>
