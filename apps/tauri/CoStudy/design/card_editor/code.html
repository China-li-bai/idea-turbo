<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-white/10">
<div class="flex size-12 shrink-0 items-center justify-start">
<button class="text-slate-500 dark:text-slate-400 p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">New Card</h2>
<div class="flex w-12 items-center justify-end">
<button class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0 px-3 py-1.5 rounded-lg hover:bg-primary/10">Save</button>
</div>
</div>
<main class="flex-1 px-4 py-4 space-y-6">
<!-- Deck Selector ListItem -->
<div class="flex items-center gap-4 bg-slate-200/50 dark:bg-slate-800/50 px-4 min-h-14 justify-between rounded-lg">
<div class="flex items-center gap-4">
<div class="text-slate-800 dark:text-white flex items-center justify-center rounded-lg bg-slate-300 dark:bg-slate-700 shrink-0 size-10">
<span class="material-symbols-outlined">layers</span>
</div>
<p class="text-slate-800 dark:text-white text-base font-normal leading-normal flex-1 truncate">Deck: Japanese Vocab</p>
</div>
<div class="shrink-0">
<div class="text-slate-500 dark:text-slate-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</div>
<!-- Front TextField -->
<div class="flex max-w-full flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex justify-between items-center pb-2">
<p class="text-slate-800 dark:text-white text-base font-medium leading-normal">Front</p>
<div class="flex items-center gap-1.5 text-xs font-medium text-slate-500 dark:text-slate-400 border border-slate-300 dark:border-slate-700 rounded-full px-2 py-0.5">
<span class="material-symbols-outlined !text-base">language</span>
<span>EN</span>
</div>
</div>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-slate-300 dark:border-slate-700 bg-slate-200/50 dark:bg-slate-800/50 focus:border-primary min-h-36 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., Question, Word"></textarea>
</label>
</div>
<!-- Back TextField -->
<div class="flex max-w-full flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex justify-between items-center pb-2">
<p class="text-slate-800 dark:text-white text-base font-medium leading-normal">Back</p>
<div class="flex items-center gap-1.5 text-xs font-medium text-slate-500 dark:text-slate-400 border border-slate-300 dark:border-slate-700 rounded-full px-2 py-0.5">
<span class="material-symbols-outlined !text-base">language</span>
<span>JA</span>
</div>
</div>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-slate-300 dark:border-slate-700 bg-slate-200/50 dark:bg-slate-800/50 focus:border-primary min-h-36 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., Answer, Definition"></textarea>
</label>
</div>
<!-- Tags Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-800 dark:text-white text-base font-medium leading-normal" for="tags">Tags</label>
<div class="flex flex-wrap items-center gap-2 p-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-200/50 dark:bg-slate-800/50 focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary">
<span class="inline-flex items-center gap-1.5 bg-primary/20 text-primary text-sm font-medium px-2.5 py-1 rounded-full">
                        N5
                        <button class="text-primary/70 hover:text-primary">
<span class="material-symbols-outlined !text-sm">close</span>
</button>
</span>
<span class="inline-flex items-center gap-1.5 bg-primary/20 text-primary text-sm font-medium px-2.5 py-1 rounded-full">
                        Vocabulary
                        <button class="text-primary/70 hover:text-primary">
<span class="material-symbols-outlined !text-sm">close</span>
</button>
</span>
<input class="form-input flex-1 bg-transparent border-0 focus:ring-0 p-0 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500" id="tags" placeholder="Add a tag..." type="text"/>
</div>
</div>
<!-- Collapsible Advanced Section -->
<div>
<details>
<summary class="flex items-center justify-between cursor-pointer py-2 text-slate-500 dark:text-slate-400 font-medium list-none">
<span>Advanced Options</span>
<span class="material-symbols-outlined transition-transform duration-200 transform details-open:rotate-180">expand_more</span>
</summary>
<div class="space-y-4 pt-4">
<label class="flex flex-col w-full">
<p class="text-slate-800 dark:text-white text-base font-medium leading-normal pb-2">Example Sentence</p>
<textarea class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-slate-300 dark:border-slate-700 bg-slate-200/50 dark:bg-slate-800/50 focus:border-primary min-h-24 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] text-base font-normal leading-normal" placeholder="Add an example sentence..."></textarea>
</label>
<label class="flex flex-col w-full">
<p class="text-slate-800 dark:text-white text-base font-medium leading-normal pb-2">Notes</p>
<textarea class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-slate-300 dark:border-slate-700 bg-slate-200/50 dark:bg-slate-800/50 focus:border-primary min-h-24 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] text-base font-normal leading-normal" placeholder="Add personal notes..."></textarea>
</label>
</div>
</details>
</div>
</main>
<!-- Action Toolbar -->
<div class="sticky bottom-0 bg-background-light dark:bg-background-dark border-t border-white/10">
<div class="flex justify-between gap-2 px-4 py-2">
<div class="flex gap-2">
<button class="p-2 text-slate-500 dark:text-slate-400 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">format_bold</span>
</button>
<button class="p-2 text-slate-500 dark:text-slate-400 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">format_italic</span>
</button>
<button class="p-2 text-slate-500 dark:text-slate-400 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">image</span>
</button>
<button class="p-2 text-slate-500 dark:text-slate-400 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
</div>
</div>
</div>
<style>
        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
        details[open] summary .details-open\:rotate-180 {
            transform: rotate(180deg);
        }
    </style>
</body></html>
