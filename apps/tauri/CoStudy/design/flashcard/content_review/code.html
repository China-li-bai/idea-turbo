<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spaced Repetition Learning Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007AFF",
                        "background-light": "#F5F5F7",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full max-w-lg mx-auto flex-col" id="flashcard-ui">
<!-- Header Section -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<!-- Top App Bar -->
<div class="flex items-center p-4">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-zinc-700 dark:text-zinc-300 hover:bg-black/5 dark:hover:bg-white/5">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<div class="flex-1 text-center">
<h2 class="text-zinc-900 dark:text-white text-lg font-bold leading-tight tracking-tight">Japanese Vocab</h2>
</div>
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-zinc-700 dark:text-zinc-300 hover:bg-black/5 dark:hover:bg-white/5">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 px-4 pb-2">
<div class="flex justify-between">
<p class="text-zinc-600 dark:text-zinc-400 text-sm font-medium leading-normal">Session Progress</p>
<p class="text-zinc-800 dark:text-zinc-200 text-sm font-semibold leading-normal">15/50</p>
</div>
<div class="rounded-full bg-zinc-200 dark:bg-zinc-700">
<div class="h-2 rounded-full bg-primary" style="width: 30%;"></div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex flex-1 flex-col p-4">
<!-- Flashcard -->
<div class="flex flex-1 flex-col items-stretch justify-center rounded-xl shadow-sm bg-white dark:bg-[#192233]">
<div class="flex flex-1 flex-col items-center justify-center p-6 text-center">
<p class="text-zinc-900 dark:text-white text-4xl md:text-5xl font-bold leading-tight tracking-tighter">こんにちは</p>
<p class="mt-2 text-zinc-500 dark:text-zinc-400 text-lg">Kon'nichiwa</p>
</div>
<!-- Card Metadata -->
<div class="border-t border-zinc-200 dark:border-zinc-700 px-6 py-4">
<p class="text-zinc-500 dark:text-zinc-400 text-sm font-normal leading-normal">Deck: N5 Vocabulary | Due in: 3d</p>
</div>
</div>
</main>
<!-- Footer / Action Area -->
<footer class="sticky bottom-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm p-4 pt-2">
<!-- "Show Answer" Button (State 1) -->
<div class="flex py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 flex-1 bg-primary text-white text-lg font-bold leading-normal tracking-tight shadow-lg shadow-primary/30">
<span class="truncate">Show Answer</span>
</button>
</div>
<!-- Hidden Feedback Buttons (State 2) - to be toggled with JS -->

            <div class="grid grid-cols-4 gap-3 py-3">
                <button class="flex flex-col min-w-0 cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-2 bg-red-500/10 dark:bg-red-500/20 text-red-600 dark:text-red-400 text-base font-bold leading-normal">
                    <span class="truncate">Again</span>
                </button>
                <button class="flex flex-col min-w-0 cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-2 bg-orange-500/10 dark:bg-orange-500/20 text-orange-600 dark:text-orange-400 text-base font-bold leading-normal">
                    <span class="truncate">Hard</span>
                </button>
                <button class="flex flex-col min-w-0 cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-2 bg-primary/10 dark:bg-primary/20 text-primary dark:text-blue-400 text-base font-bold leading-normal">
                    <span class="truncate">Good</span>
                </button>
                <button class="flex flex-col min-w-0 cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-2 bg-green-500/10 dark:bg-green-500/20 text-green-600 dark:text-green-400 text-base font-bold leading-normal">
                    <span class="truncate">Easy</span>
                </button>
            </div>
            -->
</footer>
</div>
</body></html>
