<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auri v2 Onboarding</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --primary: #FFD700; /* 金色，代表记忆与高光 */
            --primary-dim: rgba(255, 215, 0, 0.2);
            --accent: #4A90E2; /* 蓝色，代表科技与隐私 */
            --text-main: #ffffff;
            --text-sub: #8b9bb4;
            --transition: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* 手机外壳容器 */
        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: var(--bg-color);
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
        }

        /* 顶部状态栏占位 */
        .status-bar {
            height: 44px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 14px 24px;
            box-sizing: border-box;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            z-index: 10;
        }

        /* 幻灯片容器 */
        .slider-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.6s var(--transition);
            text-align: center;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }

        .slide.prev {
            transform: translateX(-100%);
            opacity: 0;
        }

        /* 视觉元素通用样式 */
        .visual-area {
            width: 260px;
            height: 260px;
            margin-bottom: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            line-height: 1.2;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: var(--text-sub);
            line-height: 1.6;
            margin: 0;
        }

        /* 底部控制区 */
        .controls {
            height: 120px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            background: linear-gradient(to top, var(--bg-color) 40%, transparent);
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #333;
            transition: 0.3s;
        }

        .dot.active {
            background-color: var(--primary);
            width: 24px;
            border-radius: 4px;
        }

        .btn-next {
            background-color: var(--text-main);
            color: #000;
            border: none;
            padding: 16px 80px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-next:active {
            transform: scale(0.95);
        }

        /* ==================== 
           Slide 1: 理性与性能 (Brain & Lock)
           ==================== */
        .brain-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid rgba(74, 144, 226, 0.3);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .brain-core {
            font-size: 60px;
        }

        /* 旋转的粒子轨道 - 代表 FSRS 算法 */
        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border-top: 2px solid var(--accent);
            animation: spin 3s linear infinite;
        }
        
        .orbit-2 {
            position: absolute;
            width: 130%;
            height: 130%;
            border-radius: 50%;
            border-bottom: 2px solid var(--primary);
            opacity: 0.5;
            animation: spin-reverse 5s linear infinite;
        }

        .tag-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .tag {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            color: var(--accent);
            border: 1px solid rgba(74, 144, 226, 0.3);
        }

        /* ==================== 
           Slide 2: 孤独与连接 (Connecting Dots)
           ==================== */
        .me-dot {
            width: 20px;
            height: 20px;
            background-color: var(--text-main);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            z-index: 2;
        }

        .other-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: var(--text-sub);
            border-radius: 50%;
            opacity: 0.3;
        }

        /* 定义位置 */
        .o1 { top: 60px; left: 40px; animation: float 4s ease-in-out infinite; }
        .o2 { bottom: 80px; right: 50px; animation: float 5s ease-in-out infinite 1s; }
        .o3 { top: 80px; right: 60px; animation: float 6s ease-in-out infinite 2s; }
        
        /* 连接线 */
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-sub), transparent);
            width: 100px;
            opacity: 0;
            transform-origin: left center;
        }

        /* 模拟 P2P 连接动画 */
        .slide.active .connection-line {
            animation: connect 3s infinite;
        }

        /* ==================== 
           Slide 3: 核心体验 (The Pulse)
           ==================== */
        .card-interface {
            width: 200px;
            height: 280px;
            background-color: var(--card-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .card-text {
            width: 60%;
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .fake-btn {
            width: 40px;
            height: 12px;
            border-radius: 6px;
            background-color: #333;
        }

        /* 光晕效果 */
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            border: 2px solid var(--primary);
            opacity: 0;
            top: 0;
            left: 0;
            box-shadow: 0 0 30px var(--primary);
        }

        .slide.active .pulse-ring {
            animation: pulse-effect 2s infinite;
        }

        /* Toast 通知 */
        .toast {
            position: absolute;
            top: -50px; /* 初始位置在上面 */
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .slide.active .toast {
            animation: slide-down 4s ease-in-out infinite;
        }

        /* ==================== 
           Slide 4: 付费 (Pricing)
           ==================== */
        .pricing-card {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: left;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        .pricing-card.selected {
            background: rgba(255, 215, 0, 0.1);
            border-color: var(--primary);
        }

        .badge {
            position: absolute;
            top: -10px;
            right: 16px;
            background: var(--primary);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 10px;
        }

        .price-title { font-weight: bold; font-size: 18px; margin-bottom: 4px; }
        .price-sub { font-size: 12px; color: var(--text-sub); }
        .price-val { float: right; font-size: 18px; font-weight: bold; }

        /* 动画定义 */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes connect {
            0% { opacity: 0; width: 0; transform: rotate(45deg); top: 50%; left: 50%; }
            50% { opacity: 0.5; width: 60px; }
            100% { opacity: 0; width: 60px; transform: rotate(45deg); top: 50%; left: 50%; }
        }

        @keyframes pulse-effect {
            0% { transform: scale(1); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        @keyframes slide-down {
            0% { top: -50px; opacity: 0; }
            20% { top: 20px; opacity: 1; }
            80% { top: 20px; opacity: 1; }
            100% { top: -50px; opacity: 0; }
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
        <span>9:41</span>
        <span>5G</span>
    </div>

    <!-- 滑动内容区 -->
    <div class="slider-container" id="slider">
        
        <!-- 页面 1：性能与隐私 -->
        <div class="slide active" id="slide1">
            <div class="visual-area">
                <div class="brain-circle">
                    <div class="orbit"></div>
                    <div class="orbit-2"></div>
                    <div class="brain-core">🔒</div>
                </div>
            </div>
            <div class="tag-container">
                <span class="tag">FSRS Algorithm</span>
                <span class="tag">Local-First</span>
            </div>
            <h1>您的第二大脑<br>完全私有</h1>
            <p>基于 PGlite 构建，极致性能。<br>数据永久留存在本地，安全无忧。</p>
        </div>

        <!-- 页面 2：孤独与共鸣 -->
        <div class="slide" id="slide2">
            <div class="visual-area">
                <div class="me-dot"></div>
                <div class="other-dot o1"></div>
                <div class="other-dot o2"></div>
                <div class="other-dot o3"></div>
                <!-- 装饰性的连接线 -->
                <div class="connection-line" style="top:50%; left:50%; transform: rotate(30deg);"></div>
                <div class="connection-line" style="top:50%; left:50%; transform: rotate(150deg); animation-delay: 1s;"></div>
            </div>
            <h1>独行<br>但不孤独</h1>
            <p>进入“平行时空自习室”。<br>没有无效社交，只有安静的陪伴。</p>
        </div>

        <!-- 页面 3：同频共振 -->
        <div class="slide" id="slide3">
            <div class="visual-area">
                <div class="toast">User A 刚刚完成 50 连胜 🔥</div>
                <div class="card-interface">
                    <div class="pulse-ring"></div>
                    <div class="card-text" style="width: 80%"></div>
                    <div class="card-text"></div>
                    <div class="card-text"></div>
                    <div class="btn-group">
                        <div class="fake-btn" style="background: #ff5555"></div>
                        <div class="fake-btn" style="background: #55ff55"></div>
                    </div>
                </div>
            </div>
            <h1>同频共振<br>无声陪伴</h1>
            <p>看见光晕，感受坚持。<br>与伙伴共享专注，见证彼此的高光时刻。</p>
        </div>

        <!-- 页面 4：付费转化 -->
        <div class="slide" id="slide4">
            <div class="visual-area" style="height: 100px; margin-bottom: 20px;">
                <div style="font-size: 50px;">🚀</div>
            </div>
            <h1 style="font-size: 24px;">投资您的专注力</h1>
            <p style="margin-bottom: 30px; font-size: 14px;">FSRS 引擎 + 终身 P2P 平行空间</p>
            
            <div class="pricing-card selected" onclick="selectPricing(this)">
                <div class="badge">开发者推荐</div>
                <div class="price-title">终身买断</div>
                <div class="price-sub">一次付费，永久拥有数据所有权</div>
                <div class="price-val">$49</div>
            </div>
            
            <div class="pricing-card" onclick="selectPricing(this)">
                <div class="price-title">年度订阅</div>
                <div class="price-sub">灵活订阅，随时取消</div>
                <div class="price-val">$12/y</div>
            </div>
        </div>

    </div>

    <!-- 底部控制区 -->
    <div class="controls">
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <button class="btn-next" onclick="nextSlide()" id="actionBtn">下一步</button>
    </div>
</div>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    const actionBtn = document.getElementById('actionBtn');

    function updateSlides() {
        slides.forEach((slide, index) => {
            slide.classList.remove('active', 'prev');
            if (index === currentSlide) {
                slide.classList.add('active');
            } else if (index < currentSlide) {
                slide.classList.add('prev');
            }
        });

        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentSlide);
        });

        if (currentSlide === 3) {
            actionBtn.textContent = "开启平行时空";
            actionBtn.style.backgroundColor = "var(--primary)";
        } else {
            actionBtn.textContent = "下一步";
            actionBtn.style.backgroundColor = "#fff";
        }
    }

    function nextSlide() {
        if (currentSlide < 3) {
            currentSlide++;
            updateSlides();
        } else {
            alert("进入 APP 主界面...");
            // 这里执行跳转逻辑
        }
    }

    function selectPricing(element) {
        document.querySelectorAll('.pricing-card').forEach(c => c.classList.remove('selected'));
        element.classList.add('selected');
    }
</script>

</body>
</html>
