<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartJourney - 智程日历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入极其干净的无衬线字体 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* 呼吸灯动画 */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(52, 199, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }
        .local-dot {
            animation: pulse-green 2s infinite;
        }

        /* 隐藏滚动条但允许滚动 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 极简无边框输入框聚焦效果 */
        .canvas-input:focus::placeholder { color: transparent; }
        
        /* 视图切换的淡入淡出动画 */
        .fade-enter { opacity: 0; transform: translateY(10px); animation: fadeIn 0.4s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* 苹果风格的 Toggle 开关 */
        .toggle-checkbox:checked { right: 0; border-color: #ffffff; }
        .toggle-checkbox:checked + .toggle-label { background-color: #ffffff; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); border-color: white; }
    </style>
</head>
<body class="bg-[#FAFAFA] text-[#111111] h-screen overflow-hidden selection:bg-gray-200">

    <!-- 顶部导航栏 (永远悬浮，极度克制) -->
    <header class="absolute top-0 w-full px-8 py-6 flex justify-between items-center z-50">
        <!-- 左侧：Logo 与 物理隔绝指示灯 -->
        <div class="flex items-center gap-3 cursor-default group">
            <h1 class="text-xl font-medium tracking-tight">SmartJourney</h1>
            <div class="flex items-center gap-1.5 opacity-60 group-hover:opacity-100 transition-opacity duration-300">
                <div class="w-2 h-2 rounded-full bg-[#34C759] local-dot"></div>
                <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">100% Local</span>
            </div>
        </div>

        <!-- 右侧：双视图 Toggle (Boss / Secretary) -->
        <div class="flex items-center gap-4">
            <span id="boss-label" class="text-sm font-medium transition-colors duration-300">Boss</span>
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" name="toggle" id="view-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-200 appearance-none cursor-pointer transition-transform duration-300 z-10 top-0 left-0"/>
                <label for="view-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-200 cursor-pointer transition-colors duration-300"></label>
            </div>
            <span id="sec-label" class="text-sm font-medium text-gray-400 transition-colors duration-300">Secretary</span>
        </div>
    </header>

    <!-- 容器 -->
    <main class="w-full h-full pt-28 px-8 flex justify-center relative">

        <!-- ==========================================
             Mode 1: Boss View (Light Mode - 执行面)
             ========================================== -->
        <section id="boss-view" class="w-full max-w-5xl h-full flex flex-col fade-enter">
            
            <!-- 灵光之池 (The Canvas) -->
            <div class="w-full flex justify-center py-12">
                <input type="text" id="main-input"
                    class="canvas-input w-full max-w-3xl text-center text-3xl font-light bg-transparent outline-none placeholder-gray-300 transition-all duration-300 focus:scale-[1.02]"
                    placeholder="在这里输入明天的会议，或是突发的灵感..." autocomplete="off" spellcheck="false">
            </div>

            <!-- 下方主体区域 -->
            <div class="flex flex-1 gap-12 mt-8 overflow-hidden">
                
                <!-- 左侧：极简时间轴 (Today) -->
                <div class="flex-1 flex flex-col overflow-y-auto pb-20">
                    <p class="text-xs uppercase tracking-widest text-gray-400 mb-6 pl-2 font-semibold">Today / 执行线</p>
                    
                    <div id="timeline-container" class="space-y-4">
                        <!-- 日程卡片 -->
                        <div class="group bg-white p-5 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex items-center gap-6 cursor-pointer hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all transform hover:-translate-y-1">
                            <span class="text-lg font-medium text-gray-400 w-16 text-right">10:00</span>
                            <div class="w-1 h-8 bg-gray-200 rounded-full group-hover:bg-[#111] transition-colors"></div>
                            <span class="text-lg font-medium flex-1">和设计团队碰头评估 UI</span>
                            <div class="w-6 h-6 rounded-full border-2 border-gray-200 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><div class="w-2 h-2 bg-[#111] rounded-full hidden group-active:block"></div></div>
                        </div>

                        <div class="group bg-white p-5 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex items-center gap-6 cursor-pointer hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all transform hover:-translate-y-1">
                            <span class="text-lg font-medium text-gray-400 w-16 text-right">14:30</span>
                            <div class="w-1 h-8 bg-gray-200 rounded-full group-hover:bg-[#111] transition-colors"></div>
                            <span class="text-lg font-medium flex-1">星巴克面见潜在投资人</span>
                            <div class="w-6 h-6 rounded-full border-2 border-gray-200 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>
                    </div>
                </div>

                <!-- 右侧：灵感胶囊 (Idea Capsules) -->
                <div class="w-72 flex flex-col border-l border-gray-100 pl-8">
                    <p class="text-xs uppercase tracking-widest text-gray-400 mb-6 font-semibold">Ideas / 灵感胶囊</p>
                    <div id="ideas-container" class="space-y-3">
                        <div class="bg-gray-50 border border-gray-100 px-5 py-3.5 rounded-full text-sm font-medium shadow-sm cursor-grab hover:-translate-y-1 hover:shadow-md transition-all active:cursor-grabbing">
                            重构后端的向量检索逻辑
                        </div>
                        <div class="bg-gray-50 border border-gray-100 px-5 py-3.5 rounded-full text-sm font-medium shadow-sm cursor-grab hover:-translate-y-1 hover:shadow-md transition-all active:cursor-grabbing">
                            周末抽空读完乔布斯传
                        </div>
                    </div>
                </div>

            </div>
        </section>


        <!-- ==========================================
             Mode 2: Secretary View (Dark Mode - 统筹面)
             ========================================== -->
        <section id="secretary-view" class="w-full max-w-3xl h-full hidden flex-col pb-8 fade-enter">
            
            <div class="flex-1 overflow-y-auto pt-10 pb-32 space-y-8 pr-4">
                
                <!-- 用户指令 -->
                <div class="flex justify-end">
                    <div class="bg-[#222] text-[#eee] px-6 py-4 rounded-2xl rounded-tr-none max-w-lg text-[15px] font-light leading-relaxed">
                        把明天的周会推迟到周五，顺便看看周五下午我还有没有空喝杯咖啡？
                    </div>
                </div>

                <!-- AI 回复卡片 (富交互) -->
                <div class="flex justify-start">
                    <div class="bg-[#1A1A1A] border border-[#333] p-6 rounded-3xl min-w-[320px] shadow-2xl">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-2 h-2 rounded-full bg-[#34C759]"></div>
                            <span class="text-sm font-medium text-gray-400">Schedule Proposal</span>
                        </div>
                        <p class="text-[15px] text-[#eee] font-light mb-6">我已经为您检查了冲突。周五下午 3:00 您有空隙，可以重新安排。</p>
                        
                        <!-- 提议的日程 -->
                        <div class="bg-[#222] rounded-xl p-4 mb-6 border border-[#333]">
                            <p class="text-sm text-gray-400 mb-1">新时间</p>
                            <p class="text-lg font-medium text-white">周五, 15:00 - 16:30</p>
                            <p class="text-sm text-gray-300 mt-2">📍 原定会议室 / ☕️ 咖啡时间</p>
                        </div>

                        <!-- 极简操作按钮 -->
                        <div class="flex gap-3">
                            <button class="flex-1 bg-white text-black font-medium py-2.5 rounded-xl hover:bg-gray-200 transition-colors">批准 (Approve)</button>
                            <button class="flex-1 bg-transparent border border-[#444] text-white font-medium py-2.5 rounded-xl hover:bg-[#333] transition-colors">修改 (Edit)</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 底部悬浮指令框 -->
            <div class="absolute bottom-10 w-full max-w-3xl left-1/2 transform -translate-x-1/2">
                <div class="relative flex items-center bg-[#1A1A1A] border border-[#333] rounded-full p-2 pl-6 shadow-2xl focus-within:border-gray-500 transition-colors">
                    <input type="text" class="w-full bg-transparent outline-none text-[#eee] font-light placeholder-gray-500 text-[15px]" placeholder="告诉秘书你想怎么调整日程...">
                    <button class="w-10 h-10 rounded-full bg-white flex items-center justify-center hover:bg-gray-200 transition-colors shrink-0">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- 全局快捷键提示 -->
    <div class="absolute bottom-6 w-full text-center pointer-events-none">
        <span class="text-xs text-gray-400 tracking-wider">Press <kbd class="font-sans border border-gray-200 px-1 rounded mx-1">Cmd</kbd> + <kbd class="font-sans border border-gray-200 px-1 rounded mx-1">K</kbd> to capture anywhere</span>
    </div>

    <!-- 交互逻辑脚本 -->
    <script>
        const toggle = document.getElementById('view-toggle');
        const body = document.body;
        const bossView = document.getElementById('boss-view');
        const secView = document.getElementById('secretary-view');
        const bossLabel = document.getElementById('boss-label');
        const secLabel = document.getElementById('sec-label');
        const mainInput = document.getElementById('main-input');
        const ideasContainer = document.getElementById('ideas-container');

        // 监听双视图切换逻辑
        toggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                // 切换到 Secretary View (Dark Mode)
                body.classList.remove('bg-[#FAFAFA]', 'text-[#111111]');
                body.classList.add('bg-[#111111]', 'text-[#FAFAFA]');
                
                bossView.classList.add('hidden');
                secView.classList.remove('hidden');
                
                bossLabel.classList.add('text-gray-500');
                bossLabel.classList.remove('text-[#111111]');
                secLabel.classList.remove('text-gray-400');
                secLabel.classList.add('text-white');
            } else {
                // 切换到 Boss View (Light Mode)
                body.classList.add('bg-[#FAFAFA]', 'text-[#111111]');
                body.classList.remove('bg-[#111111]', 'text-[#FAFAFA]');
                
                secView.classList.add('hidden');
                bossView.classList.remove('hidden');
                
                bossLabel.classList.remove('text-gray-500');
                bossLabel.classList.add('text-[#111111]');
                secLabel.classList.add('text-gray-400');
                secLabel.classList.remove('text-white');
                
                // 自动聚焦灵光之池
                setTimeout(() => mainInput.focus(), 100);
            }
        });

        // 简单的回车交互模拟：如果输入没有时间特征，就当做灵感胶囊加入右侧
        mainInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                const text = this.value.trim();
                
                // 创建一个新的灵感胶囊
                const capsule = document.createElement('div');
                capsule.className = 'bg-gray-50 border border-gray-100 px-5 py-3.5 rounded-full text-sm font-medium shadow-sm cursor-grab hover:-translate-y-1 hover:shadow-md transition-all fade-enter';
                capsule.innerText = text;
                
                // 插入到最前面
                ideasContainer.insertBefore(capsule, ideasContainer.firstChild);
                
                // 清空输入框
                this.value = '';
            }
        });

        // 初始化光标
        window.onload = () => mainInput.focus();
    </script>
</body>
</html>
