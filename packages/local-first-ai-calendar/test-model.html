<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local-First AI Calendar - 完整测试</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #333;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }
    
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    
    .progress {
      margin-top: 12px;
    }
    
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #e9ecef;
      border-radius: 10px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: #007bff;
      transition: width 0.3s;
    }
    
    .section {
      margin-bottom: 24px;
    }
    
    h2 {
      color: #444;
      font-size: 18px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    .btn-primary {
      background: #007bff;
      color: white;
    }
    
    .btn-primary:hover {
      background: #0056b3;
    }
    
    .btn-primary:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-success:hover {
      background: #1e7e34;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .log {
      background: #2d2d2d;
      color: #00ff00;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .log-entry {
      margin-bottom: 4px;
    }
    
    .log-entry.error {
      color: #ff6b6b;
    }
    
    .log-entry.info {
      color: #4ecdc4;
    }
    
    .log-entry.warn {
      color: #ffd93d;
    }
    
    .event-list {
      list-style: none;
    }
    
    .event-item {
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .event-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    
    .event-meta {
      font-size: 12px;
      color: #666;
    }
    
    .search-results {
      margin-top: 16px;
    }
    
    .result-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .result-score {
      font-size: 12px;
      color: #28a745;
      font-weight: 600;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #555;
    }
    
    input, textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    
    textarea {
      min-height: 80px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗓️ Local-First AI Calendar</h1>
    <p class="subtitle">完整测试 - 模型下载与向量搜索</p>
    
    <div id="status" class="status info">
      准备就绪，点击下方按钮开始
    </div>
    
    <div id="progressSection" class="section" style="display: none;">
      <div class="progress">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>
        <p id="progressText" style="margin-top: 8px; font-size: 14px; color: #666;"></p>
      </div>
    </div>
    
    <div class="section">
      <h2>🚀 快速操作</h2>
      <div class="btn-group">
        <button id="initBtn" class="btn btn-primary" onclick="initializeModel()">
          初始化模型
        </button>
        <button id="sampleBtn" class="btn btn-success" onclick="testEmbedding()" disabled>
          测试向量生成
        </button>
      </div>
    </div>
    
    <div class="section">
      <h2>📝 日志</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    
    let extractor = null;
    let isLoading = false;
    
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${time}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[${type.toUpperCase()}]`, message);
    }
    
    function setStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      statusDiv.className = `status ${type}`;
      statusDiv.textContent = message;
    }
    
    function updateProgress(progress, text) {
      const progressSection = document.getElementById('progressSection');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      
      progressSection.style.display = 'block';
      progressFill.style.width = `${progress}%`;
      progressText.textContent = text;
    }
    
    async function initializeModel() {
      if (extractor || isLoading) {
        log('模型已经在加载或已加载', 'warn');
        return;
      }
      
      isLoading = true;
      const initBtn = document.getElementById('initBtn');
      initBtn.disabled = true;
      
      try {
        log('开始初始化模型...');
        setStatus('正在初始化模型...', 'info');
        
        env.allowLocalModels = true;
        env.allowRemoteModels = true;
        env.useBrowserCache = true;
        
        log('配置已设置: allowRemoteModels=true, useBrowserCache=true');
        log('正在下载/加载模型: Xenova/multilingual-e5-small');
        log('注意: 首次加载需要下载约 100-150MB 的模型文件，请耐心等待...');
        
        extractor = await pipeline('feature-extraction', 'Xenova/multilingual-e5-small', {
          quantized: true,
          progress_callback: (progress) => {
            if (progress.status === 'downloading') {
              const percentage = progress.progress ? Math.round(progress.progress * 100) : 0;
              updateProgress(percentage, `下载进度: ${percentage}% - ${progress.file || '模型文件'}`);
              log(`下载进度: ${percentage}%`, 'info');
            } else if (progress.status === 'loading') {
              updateProgress(95, '正在加载模型...');
              log('正在加载模型...', 'info');
            }
          }
        });
        
        updateProgress(100, '模型加载完成！');
        log('模型初始化成功！', 'success');
        setStatus('模型已就绪 ✓', 'success');
        
        document.getElementById('sampleBtn').disabled = false;
        
      } catch (error) {
        log(`初始化失败: ${error.message}`, 'error');
        setStatus(`初始化失败: ${error.message}`, 'error');
        console.error(error);
        initBtn.disabled = false;
      } finally {
        isLoading = false;
      }
    }
    
    async function testEmbedding() {
      if (!extractor) {
        log('请先初始化模型', 'error');
        return;
      }
      
      try {
        log('开始测试向量生成...');
        
        const testTexts = [
          '这是一个简单的测试。',
          '团队周会 - 讨论本周工作进度和下周计划',
          '产品设计评审 - 新功能设计方案评审'
        ];
        
        for (const text of testTexts) {
          log(`正在为文本生成向量: "${text.substring(0, 50)}..."`);
          
          const output = await extractor(text, { pooling: 'mean', normalize: true });
          const embedding = Array.from(output.data);
          
          log(`✓ 向量生成成功! 维度: ${embedding.length}`, 'success');
          log(`  前5个值: [${embedding.slice(0, 5).map(v => v.toFixed(4)).join(', ')}...]`);
        }
        
        log('所有测试完成！', 'success');
        setStatus('测试完成 ✓', 'success');
        
      } catch (error) {
        log(`测试失败: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    window.initializeModel = initializeModel;
    window.testEmbedding = testEmbedding;
    
    log('测试页面已加载');
    log('模型将从 Hugging Face 下载: Xenova/multilingual-e5-small');
    log('首次下载约需 100-150MB，之后会缓存到浏览器');
  </script>
</body>
</html>
