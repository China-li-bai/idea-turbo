<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量存储与查询准确率测试 v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h2 {
            color: #333;
            margin-bottom: 16px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress {
            width: 100%;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin: 16px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        .test-results {
            margin-top: 20px;
        }
        
        .test-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }
        
        .test-query {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .test-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .metric {
            background: white;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .metric-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }
        
        .result-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .result-title {
            font-weight: bold;
            color: #333;
        }
        
        .result-score {
            color: #667eea;
            font-weight: bold;
        }
        
        .result-meta {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }
        
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-entry {
            margin-bottom: 4px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .log-info {
            color: #4fc3f7;
        }
        
        .log-success {
            color: #66bb6a;
        }
        
        .log-error {
            color: #ef5350;
        }
        
        .log-warning {
            color: #ffa726;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 批量存储与查询准确率测试 v2</h1>
        
        <div class="card">
            <h2>测试配置</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="eventCount">0</div>
                    <div class="stat-label">测试事件数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="queryCount">0</div>
                    <div class="stat-label">测试查询数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgAccuracy">0%</div>
                    <div class="stat-label">平均准确率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgTime">0ms</div>
                    <div class="stat-label">平均查询时间</div>
                </div>
            </div>
            
            <button id="initModelBtn" onclick="initializeModel()">🤖 初始化模型</button>
            <button id="runFullTestBtn" onclick="runFullTest()">🚀 开始完整测试</button>
            <button id="generateBtn" onclick="generateTestData()">📝 生成测试数据</button>
            <button id="insertBtn" onclick="batchInsert()">💾 批量存储</button>
            <button id="queryBtn" onclick="runQueries()">🔍 执行查询</button>
            <button id="clearBtn" onclick="clearData()">🗑️ 清空数据</button>
            
            <div id="progressContainer" class="progress" style="display: none;">
                <div id="progressBar" class="progress-bar" style="width: 0%">0%</div>
            </div>
        </div>
        
        <div class="card">
            <h2>测试结果</h2>
            <div id="testResults" class="test-results"></div>
        </div>
        
        <div class="card">
            <h2>执行日志</h2>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script type="module">
        import { createLocalFirstAICalendar } from './dist/bundle.js';
        
        const calendar = createLocalFirstAICalendar();
        
        let testEvents = [];
        let testQueries = [];
        let queryResults = [];
        
        const logEl = document.getElementById('log');
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function updateProgress(percent, text = '') {
            const container = document.getElementById('progressContainer');
            const bar = document.getElementById('progressBar');
            container.style.display = 'block';
            bar.style.width = `${percent}%`;
            bar.textContent = text || `${percent}%`;
        }
        
        window.initializeModel = async function() {
            try {
                log('开始初始化模型...', 'info');
                const initBtn = document.getElementById('initModelBtn');
                initBtn.disabled = true;
                
                await calendar.initialize();
                
                log('✅ 模型初始化成功！', 'success');
                log('系统已就绪，可以开始测试', 'info');
            } catch (error) {
                log(`❌ 模型初始化失败: ${error.message}`, 'error');
                console.error(error);
                document.getElementById('initModelBtn').disabled = false;
            }
        };
        
        function generateRandomEvent(id) {
            const titles = [
                '团队会议', '项目评审', '客户拜访', '技术分享', '产品发布',
                '代码审查', '需求讨论', '架构设计', '性能优化', '安全审计',
                '用户访谈', '市场调研', '竞品分析', '运营会议', '财务报告'
            ];
            
            const descriptions = [
                '讨论项目进度和下一步计划',
                '评审代码质量和架构设计',
                '了解客户需求和反馈',
                '分享最新技术和最佳实践',
                '准备产品上线和推广计划',
                '检查代码规范和安全问题',
                '明确需求细节和优先级',
                '设计系统架构和技术方案',
                '优化系统性能和响应速度',
                '检查系统安全和数据保护'
            ];
            
            const locations = ['会议室A', '会议室B', '线上会议', '客户现场', '办公室'];
            const attendees = ['张三', '李四', '王五', '赵六', '钱七'];
            const tags = ['工作', '重要', '紧急', '常规', '项目'];
            const categories = ['会议', '评审', '拜访', '分享', '发布'];
            
            const startDate = new Date();
            startDate.setDate(startDate.getDate() + Math.floor(Math.random() * 30));
            startDate.setHours(9 + Math.floor(Math.random() * 8), 0, 0, 0);
            
            const endDate = new Date(startDate);
            endDate.setHours(startDate.getHours() + 1 + Math.floor(Math.random() * 2));
            
            return {
                id: `event-${id}`,
                title: titles[Math.floor(Math.random() * titles.length)] + ` #${id}`,
                description: descriptions[Math.floor(Math.random() * descriptions.length)],
                startTime: startDate,
                endTime: endDate,
                location: locations[Math.floor(Math.random() * locations.length)],
                attendees: attendees.slice(0, 1 + Math.floor(Math.random() * 3)),
                tags: tags.slice(0, 1 + Math.floor(Math.random() * 3)),
                category: categories[Math.floor(Math.random() * categories.length)]
            };
        }
        
        window.generateTestData = async function() {
            log('开始生成测试数据...', 'info');
            
            testEvents = [];
            const count = 15;
            
            for (let i = 0; i < count; i++) {
                testEvents.push(generateRandomEvent(i + 1));
                updateProgress(Math.round((i + 1) / count * 100), `生成中 ${i + 1}/${count}`);
            }
            
            document.getElementById('eventCount').textContent = testEvents.length;
            log(`✅ 已生成 ${testEvents.length} 个测试事件`, 'success');
            
            testQueries = [
                '团队会议',
                '项目评审',
                '客户相关',
                '技术分享',
                '产品发布',
                '代码审查',
                '需求讨论',
                '架构设计',
                '性能优化',
                '安全审计'
            ];
            
            document.getElementById('queryCount').textContent = testQueries.length;
            log(`已准备 ${testQueries.length} 个测试查询`, 'info');
        };
        
        window.batchInsert = async function() {
            try {
                log('初始化日历系统...', 'info');
                
                await calendar.initialize();
                
                log('开始批量插入数据...', 'info');
                const startTime = performance.now();
                
                for (let i = 0; i < testEvents.length; i++) {
                    const event = testEvents[i];
                    await calendar.addEvent(event);
                    updateProgress(Math.round((i + 1) / testEvents.length * 100), `插入中 ${i + 1}/${testEvents.length}`);
                    log(`插入事件 ${i + 1}: ${event.title}`, 'info');
                }
                
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                
                log(`✅ 批量插入完成，耗时 ${duration}ms`, 'success');
                log(`平均每个事件插入时间: ${(duration / testEvents.length).toFixed(2)}ms`, 'info');
                
                const stats = calendar.getStats();
                log(`数据库统计: ${stats.liveCount} 个活跃向量`, 'info');
                
            } catch (error) {
                log(`❌ 批量插入失败: ${error.message}`, 'error');
                console.error(error);
            }
        };
        
        window.runQueries = async function() {
            try {
                log('开始执行查询测试...', 'info');
                queryResults = [];
                
                const startTime = performance.now();
                
                for (let i = 0; i < testQueries.length; i++) {
                    const query = testQueries[i];
                    log(`执行查询 ${i + 1}/${testQueries.length}: "${query}"`, 'info');
                    
                    const queryStart = performance.now();
                    const results = await calendar.searchEvents(query, 5);
                    const queryEnd = performance.now();
                    
                    const queryTime = queryEnd - queryStart;
                    
                    const relevantCount = results.filter(r => 
                        r.event.title.toLowerCase().includes(query.toLowerCase()) ||
                        r.event.description.toLowerCase().includes(query.toLowerCase())
                    ).length;
                    
                    const accuracy = results.length > 0 ? (relevantCount / results.length * 100) : 0;
                    
                    queryResults.push({
                        query,
                        results,
                        queryTime,
                        accuracy,
                        relevantCount
                    });
                    
                    log(`查询 "${query}" 完成，耗时 ${queryTime.toFixed(2)}ms，准确率 ${accuracy.toFixed(1)}%`, 'success');
                    updateProgress(Math.round((i + 1) / testQueries.length * 100), `查询中 ${i + 1}/${testQueries.length}`);
                }
                
                const endTime = performance.now();
                const totalDuration = endTime - startTime;
                
                const avgAccuracy = queryResults.reduce((sum, r) => sum + r.accuracy, 0) / queryResults.length;
                const avgTime = totalDuration / queryResults.length;
                
                document.getElementById('avgAccuracy').textContent = `${avgAccuracy.toFixed(1)}%`;
                document.getElementById('avgTime').textContent = `${avgTime.toFixed(0)}ms`;
                
                log(`✅ 查询测试完成`, 'success');
                log(`总耗时: ${totalDuration.toFixed(2)}ms`, 'info');
                log(`平均准确率: ${avgAccuracy.toFixed(1)}%`, 'info');
                log(`平均查询时间: ${avgTime.toFixed(2)}ms`, 'info');
                
                displayResults();
                
            } catch (error) {
                log(`❌ 查询测试失败: ${error.message}`, 'error');
                console.error(error);
            }
        };
        
        function displayResults() {
            const container = document.getElementById('testResults');
            container.innerHTML = '';
            
            queryResults.forEach((result, index) => {
                const item = document.createElement('div');
                item.className = 'test-item';
                
                let resultsHtml = '';
                result.results.forEach((r, i) => {
                    resultsHtml += `
                        <div class="result-item">
                            <div class="result-title">${i + 1}. ${r.event.title}</div>
                            <div class="result-score">相似度: ${(r.score * 100).toFixed(1)}%</div>
                            <div class="result-meta">${r.event.startTime.toLocaleString()} - ${r.event.location || '无地点'}</div>
                        </div>
                    `;
                });
                
                item.innerHTML = `
                    <div class="test-query">查询 ${index + 1}: "${result.query}"</div>
                    <div class="test-metrics">
                        <div class="metric">
                            <div class="metric-value">${result.accuracy.toFixed(1)}%</div>
                            <div class="metric-label">准确率</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${result.queryTime.toFixed(0)}ms</div>
                            <div class="metric-label">查询时间</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${result.relevantCount}/${result.results.length}</div>
                            <div class="metric-label">相关结果</div>
                        </div>
                    </div>
                    <div style="margin-top: 12px;">
                        ${resultsHtml}
                    </div>
                `;
                
                container.appendChild(item);
            });
        }
        
        window.clearData = async function() {
            try {
                log('清空数据...', 'info');
                await calendar.clearAll();
                testEvents = [];
                testQueries = [];
                queryResults = [];
                
                document.getElementById('eventCount').textContent = '0';
                document.getElementById('queryCount').textContent = '0';
                document.getElementById('avgAccuracy').textContent = '0%';
                document.getElementById('avgTime').textContent = '0ms';
                document.getElementById('testResults').innerHTML = '';
                
                log('✅ 数据已清空', 'success');
            } catch (error) {
                log(`❌ 清空数据失败: ${error.message}`, 'error');
                console.error(error);
            }
        };
        
        window.runFullTest = async function() {
            log('🚀 开始完整测试流程...', 'info');
            
            await generateTestData();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await batchInsert();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await runQueries();
            
            log('✅ 完整测试流程结束', 'success');
        };
        
        log('系统已就绪，点击按钮开始测试', 'info');
    </script>
</body>
</html>
