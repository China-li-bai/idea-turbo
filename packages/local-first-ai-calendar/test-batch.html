            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

            const container = document.getElementById('progressContainer');
            const bar = document.getElementById('progressBar');
            container.style.display = 'block';
            bar.style.width = `${percent}%`;
            bar.textContent = text || `${percent}%`;

        async function batchInsert() {
            try {
                log('初始化日历系统...', 'info');
                
                await calendar.initialize();
                
                log('开始批量插入数据...', 'info');
                const startTime = performance.now();
                
                for (let i = 0; i < testEvents.length; i++) {
                    const event = testEvents[i];
                    await calendar.addEvent(event);
                    updateProgress(Math.round((i + 1) / testEvents.length * 100), `插入中 ${i + 1}/${testEvents.length}`);
                    log(`插入事件 ${i + 1}: ${event.title}`, 'info');
                }
                
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                
                log(`✅ 批量插入完成，耗时 ${duration}ms`, 'success');
                log(`平均每个事件插入时间: ${(duration / testEvents.length).toFixed(2)}ms`, 'info');
                
                const stats = calendar.getStats();
                log(`数据库统计: ${stats.liveCount} 个活跃向量`, 'info');
                
                document.getElementById('queryBtn').disabled = false;
                document.getElementById('insertBtn').disabled = true;
                
            } catch (error) {
                log(`❌ 批量插入失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function runQueries() {
            try {
                log('开始执行查询测试...', 'info');
                queryResults = [];
                
                let totalAccuracy = 0;
                let totalTime = 0;
                
                for (let i = 0; i < testQueries.length; i++) {
                    const testQuery = testQueries[i];
                    log(`执行查询 ${i + 1}/${testQueries.length}: "${testQuery.query}"`, 'info');
                    
                    const startTime = performance.now();
                    const results = await calendar.searchEvents(testQuery.query, 5);
                    const endTime = performance.now();
                    
                    const queryTime = endTime - startTime;
                    totalTime += queryTime;
                    
                    let relevantCount = 0;
                    results.forEach(result => {
                        const hasExpectedTag = testQuery.expectedTags.some(tag => 
                            result.event.tags && result.event.tags.includes(tag)
                        );
                        if (hasExpectedTag) relevantCount++;
                    });
                    
                    const accuracy = results.length > 0 ? (relevantCount / results.length) * 100 : 0;
                    totalAccuracy += accuracy;
                    
                    queryResults.push({
                        query: testQuery.query,
                        description: testQuery.description,
                        results: results,
                        accuracy: accuracy,
                        queryTime: queryTime,
                        relevantCount: relevantCount,
                        totalResults: results.length
                    });
                    
                    updateProgress(
                        Math.round((i + 1) / testQueries.length * 100),
                        `查询中 ${i + 1}/${testQueries.length}`
                    );
                    
                    log(`  结果数: ${results.length}, 相关结果: ${relevantCount}, 准确率: ${accuracy.toFixed(1)}%`, 'info');
                }
                
                const avgAccuracy = totalAccuracy / testQueries.length;
                const avgTime = totalTime / testQueries.length;
                
                document.getElementById('avgAccuracy').textContent = `${avgAccuracy.toFixed(1)}%`;
                document.getElementById('avgTime').textContent = `${avgTime.toFixed(2)}ms`;
                
                log(`✅ 查询测试完成`, 'success');
                log(`平均准确率: ${avgAccuracy.toFixed(2)}%`, 'success');
                log(`平均查询时间: ${avgTime.toFixed(2)}ms`, 'success');
                
                displayResults();
                
                document.getElementById('queryBtn').disabled = true;
                
            } catch (error) {
                log(`❌ 查询测试失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        function displayResults() {

            queryResults.forEach((result, index) => {
                const chartBar = document.createElement('div');
                chartBar.className = 'chart-bar';
                
                const label = document.createElement('div');
                label.className = 'chart-label';
                label.textContent = `查询 ${index + 1}`;
                
                const fill = document.createElement('div');
                fill.className = 'chart-fill';
                
                const fillInner = document.createElement('div');
                fillInner.className = 'chart-fill-inner';
                fillInner.style.width = `${result.accuracy}%`;
                fillInner.textContent = `${result.accuracy.toFixed(1)}%`;
                
                fill.appendChild(fillInner);
                chartBar.appendChild(label);
                chartBar.appendChild(fill);
                accuracyChart.appendChild(chartBar);
            });
            
            testResults.innerHTML = '';
            
            queryResults.forEach((result, index) => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                
                testItem.innerHTML = `
                    <div class="test-query">查询 ${index + 1}: "${result.query}"</div>
                    <div style="color: #666; font-size: 0.9em; margin-bottom: 8px;">${result.description}</div>
                    <div class="test-metrics">
                        <div class="metric">
                            <div class="metric-value">${result.accuracy.toFixed(1)}%</div>
                            <div class="metric-label">准确率</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${result.queryTime.toFixed(2)}ms</div>
                            <div class="metric-label">查询时间</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${result.relevantCount}/${result.totalResults}</div>
                            <div class="metric-label">相关结果</div>
                        </div>
                    </div>
                    <div style="margin-top: 12px;">
                        <strong>搜索结果:</strong>
                        ${result.results.map((r, i) => `
                            <div class="result-item">
                                <div class="result-title">${i + 1}. ${r.event.title}</div>
                                <div class="result-score">相似度: ${(r.score * 100).toFixed(2)}%</div>
                                <div class="result-meta">
                                    ${r.event.description}<br>
                                    时间: ${r.event.startTime.toLocaleString()} | 
                                    标签: ${r.event.tags ? r.event.tags.join(', ') : '无'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                testResults.appendChild(testItem);
            });
        }
        
        async function runFullTest() {
            log('🚀 开始完整测试流程...', 'info');
            
            await generateTestData();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await batchInsert();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await runQueries();
            
            log('✅ 完整测试流程结束', 'success');
        }
        
        async function clearAll() {
            try {
                if (calendar) {
                    await calendar.clearAll();
                    log('✅ 数据已清空', 'success');
                    
                    calendar = null;
                    testEvents = [];
                    queryResults = [];
                    
                    document.getElementById('totalEvents').textContent = '0';
                    document.getElementById('testQueries').textContent = '0';
                    document.getElementById('avgAccuracy').textContent = '0%';
                    document.getElementById('avgTime').textContent = '0ms';
                    document.getElementById('resultsCard').style.display = 'none';
                    document.getElementById('progressContainer').style.display = 'none';
                    
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('insertBtn').disabled = true;
                    document.getElementById('queryBtn').disabled = true;
                }
            } catch (error) {
                log(`❌ 清空失败: ${error.message}`, 'error');
            }
        }
        
        window.generateTestData = generateTestData;
        window.batchInsert = batchInsert;
        window.runQueries = runQueries;
        window.runFullTest = runFullTest;
        window.clearAll = clearAll;
        
        log('系统已就绪，点击按钮开始测试', 'info');
    </script>
</body>
</html>
