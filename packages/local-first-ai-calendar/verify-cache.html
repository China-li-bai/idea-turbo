<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缓存验证 - Transformers.js</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #333;
      margin-bottom: 8px;
    }
    
    .section {
      margin: 20px 0;
      padding: 16px;
      border-radius: 8px;
      background: #f8f9fa;
    }
    
    .cache-item {
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    
    .cache-item strong {
      color: #007bff;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin: 4px;
    }
    
    .btn-primary {
      background: #007bff;
      color: white;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    
    .info {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .highlight {
      background: #fff3cd;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Transformers.js 缓存验证</h1>
    
    <div class="section">
      <h2>缓存机制说明</h2>
      <p class="info">
        Transformers.js 使用 <span class="highlight">Cache API</span> 存储模型文件，
        而不是 IndexedDB。Cache API 是浏览器专门用于缓存 HTTP 请求和响应的存储机制。
      </p>
    </div>
    
    <div class="section">
      <h2>缓存存储位置</h2>
      <div>
        <button class="btn btn-primary" onclick="checkCacheAPI()">检查 Cache API</button>
        <button class="btn btn-primary" onclick="checkIndexedDB()">检查 IndexedDB</button>
        <button class="btn btn-danger" onclick="clearCache()">清空缓存</button>
      </div>
      <div id="cacheResults" style="margin-top: 16px;"></div>
    </div>
    
    <div class="section">
      <h2>存储对比</h2>
      <table style="width: 100%; border-collapse: collapse;">
        <tr style="background: #e9ecef;">
          <th style="padding: 12px; text-align: left; border: 1px solid #dee2e6;">特性</th>
          <th style="padding: 12px; text-align: left; border: 1px solid #dee2e6;">Cache API</th>
          <th style="padding: 12px; text-align: left; border: 1px solid #dee2e6;">IndexedDB</th>
        </tr>
        <tr>
          <td style="padding: 12px; border: 1px solid #dee2e6;"><strong>用途</strong></td>
          <td style="padding: 12px; border: 1px solid #dee2e6;">缓存 HTTP 请求/响应</td>
          <td style="padding: 12px; border: 1px solid #dee2e6;">存储结构化数据</td>
        </tr>
        <tr>
          <td style="padding: 12px; border: 1px solid #dee2e6;"><strong>适用场景</strong></td>
          <td style="padding: 12px; border: 1px solid #dee2e6;">模型文件、静态资源</td>
          <td style="padding: 12px; border: 1px solid #dee2e6;">用户数据、事件数据</td>
        </tr>
        <tr>
          <td style="padding: 12px; border: 1px solid #dee2e6;"><strong>我们的使用</strong></td>
          <td style="padding: 12px; border: 1px solid #dee2e6; color: #28a745;">✅ 模型缓存</td>
          <td style="padding: 12px; border: 1px solid #dee2e6; color: #28a745;">✅ 日历事件存储</td>
        </tr>
        <tr>
          <td style="padding: 12px; border: 1px solid #dee2e6;"><strong>开发者工具位置</strong></td>
          <td style="padding: 12px; border: 1px solid #dee2e6;">Application → Cache Storage</td>
          <td style="padding: 12px; border: 1px solid #dee2e6;">Application → IndexedDB</td>
        </tr>
      </table>
    </div>
  </div>

  <script>
    async function checkCacheAPI() {
      const resultsDiv = document.getElementById('cacheResults');
      resultsDiv.innerHTML = '<p>正在检查 Cache API...</p>';
      
      try {
        const cacheNames = await caches.keys();
        
        if (cacheNames.length === 0) {
          resultsDiv.innerHTML = `
            <div class="cache-item">
              <strong>Cache API 状态：</strong> 暂无缓存<br>
              <span class="info">首次加载模型后会自动创建缓存</span>
            </div>
          `;
          return;
        }
        
        let html = '<h3>Cache API 缓存列表：</h3>';
        
        for (const cacheName of cacheNames) {
          const cache = await caches.open(cacheName);
          const keys = await cache.keys();
          
          html += `
            <div class="cache-item">
              <strong>缓存名称：</strong> ${cacheName}<br>
              <strong>文件数量：</strong> ${keys.length}<br>
              <strong>文件列表：</strong>
              <ul style="margin: 8px 0; padding-left: 20px; font-size: 12px;">
          `;
          
          let totalSize = 0;
          for (const request of keys) {
            const response = await cache.match(request);
            const blob = await response.blob();
            totalSize += blob.size;
            
            const fileName = request.url.split('/').pop();
            const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
            html += `<li>${fileName} (${sizeMB} MB)</li>`;
          }
          
          const totalMB = (totalSize / 1024 / 1024).toFixed(2);
          html += `
              </ul>
              <strong>总大小：</strong> ${totalMB} MB
            </div>
          `;
        }
        
        resultsDiv.innerHTML = html;
        
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="cache-item" style="color: #dc3545;">
            <strong>错误：</strong> ${error.message}
          </div>
        `;
      }
    }
    
    async function checkIndexedDB() {
      const resultsDiv = document.getElementById('cacheResults');
      resultsDiv.innerHTML = '<p>正在检查 IndexedDB...</p>';
      
      try {
        const databases = await indexedDB.databases();
        
        if (databases.length === 0) {
          resultsDiv.innerHTML = `
            <div class="cache-item">
              <strong>IndexedDB 状态：</strong> 暂无数据库<br>
              <span class="info">日历事件数据将存储在这里</span>
            </div>
          `;
          return;
        }
        
        let html = '<h3>IndexedDB 数据库列表：</h3>';
        
        for (const db of databases) {
          html += `
            <div class="cache-item">
              <strong>数据库名称：</strong> ${db.name || '未命名'}<br>
              <strong>版本：</strong> ${db.version || 'N/A'}
            </div>
          `;
        }
        
        resultsDiv.innerHTML = html;
        
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="cache-item" style="color: #dc3545;">
            <strong>错误：</strong> ${error.message}
          </div>
        `;
      }
    }
    
    async function clearCache() {
      const resultsDiv = document.getElementById('cacheResults');
      
      if (!confirm('确定要清空所有缓存吗？这将删除已下载的模型文件。')) {
        return;
      }
      
      try {
        const cacheNames = await caches.keys();
        
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
        }
        
        resultsDiv.innerHTML = `
          <div class="cache-item" style="color: #28a745;">
            <strong>✓ 缓存已清空</strong><br>
            <span class="info">已删除 ${cacheNames.length} 个缓存</span>
          </div>
        `;
        
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="cache-item" style="color: #dc3545;">
            <strong>错误：</strong> ${error.message}
          </div>
        `;
      }
    }
    
    // 页面加载时自动检查
    window.addEventListener('load', () => {
      checkCacheAPI();
    });
  </script>
</body>
</html>
