name: Deploy to VPS (ai-calendar)

on:
  push:
    branches: [home]
    paths:
      - "apps/ai-calendar/**"
      - "packages/local-first-sdk/**"
  workflow_dispatch:

concurrency:
  group: deploy-ai-calendar
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/ai-calendar
            packages/local-first-sdk
          sparse-checkout-cone-mode: false

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_NAME="ai-calendar"
            APP_PORT=3002
            APP_DIR="/var/www/${APP_NAME}"

            echo "[INFO] Deploying ${APP_NAME} from home branch..."

            # Pull latest code
            cd "$APP_DIR"
            git fetch origin home
            git checkout home
            git pull origin home

            # Install dependencies
            pnpm install --filter @idea-turbo/local-first-sdk --filter ai-calendar

            # Build
            pnpm build --filter @idea-turbo/local-first-sdk
            pnpm build --filter ai-calendar

            # Prepare standalone
            cp -r apps/ai-calendar/public apps/ai-calendar/.next/standalone/
            cp -r apps/ai-calendar/.next/static apps/ai-calendar/.next/standalone/.next/

            # Set permissions
            sudo chown -R www-data:www-data "$APP_DIR"
            sudo chmod -R 755 "$APP_DIR"

            # PM2 restart
            pm2 stop $APP_NAME 2>/dev/null || true
            pm2 delete $APP_NAME 2>/dev/null || true
            cd "$APP_DIR/apps/ai-calendar"
            pm2 start ecosystem.config.cjs
            pm2 save

            echo "[INFO] PM2 started $APP_NAME on port $APP_PORT"

            # Verify
            sleep 3
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:$APP_PORT | grep -q "200\|304"; then
              echo "[INFO] ✅ Application is running on port $APP_PORT"
            else
              echo "[WARN] Application may not be responding correctly"
              pm2 logs $APP_NAME --lines 20 --nostream
            fi

            echo "[INFO] 🎉 Deployment completed!"
            echo "[INFO] Access your app at: https://privlocal.com"
