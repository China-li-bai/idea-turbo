name: CI/CD Deploy to VPS (ai-calendar)

on:
  push:
    branches: ["home"]
    paths:
      - "apps/ai-calendar/**"
      - "packages/local-first-sdk/**"
      - "packages/brain-trust/**"
      - "packages/voice-input/**"
      - "packages/wisdom-ui/**"
      - ".github/workflows/deploy-ai-calendar.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ai-calendar
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies in monorepo
        run: pnpm install --no-frozen-lockfile

      - name: Clean build cache
        run: rm -rf apps/ai-calendar/.next apps/ai-calendar/tsconfig.tsbuildinfo

      - name: Build workspace dependencies
        run: |
          pnpm --filter @idea-turbo/local-first-sdk build
          pnpm --filter @idea-turbo/brain-trust build
          pnpm --filter @idea-turbo/voice-input build
          pnpm --filter @idea-turbo/wisdom-ui build

      - name: Build ai-calendar app
        run: pnpm --filter ai-calendar build
        env:
          NODE_ENV: production

      - name: Prepare full build directory
        run: |
          mkdir -p apps/ai-calendar/.next/standalone
          cp -r apps/ai-calendar/.next apps/ai-calendar/.next/standalone/
          cp -r apps/ai-calendar/package.json apps/ai-calendar/.next/standalone/
          cp -r apps/ai-calendar/package-lock.json apps/ai-calendar/.next/standalone/ 2>/dev/null || true
          cp -r apps/ai-calendar/public apps/ai-calendar/.next/standalone/

      - name: Install dependencies for standalone
        run: cd apps/ai-calendar/.next/standalone && pnpm install --prod

      - name: Archive full app
        run: |
          tar --warning=no-file-changed -czf /tmp/ai-calendar.tar.gz -C apps/ai-calendar/.next/standalone .
          mv /tmp/ai-calendar.tar.gz .

      - name: Copy tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "ai-calendar.tar.gz"
          target: "/tmp/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_NAME="ai-calendar"
            APP_PORT=4439
            TAR="/tmp/ai-calendar.tar.gz"
            APP_DIR="/var/www/${APP_NAME}"

            echo "[INFO] Deploying ${APP_NAME}..."

            # Clean up existing deployment directory
            if [ -d "$APP_DIR" ]; then
              echo "[INFO] Cleaning up existing deployment..."
              sudo rm -rf "$APP_DIR"
            fi

            # Create directories
            sudo mkdir -p "$APP_DIR"
            sudo mkdir -p /var/log/pm2

            # Extract new version
            sudo tar -xzf "$TAR" -C "$APP_DIR"
            echo "[INFO] Files extracted successfully"

            # Verify .next/static exists
            if [ -d "$APP_DIR/.next/static" ]; then
              echo "[INFO] ✅ .next/static directory exists"
            else
              echo "[ERROR] .next/static directory not found!"
              ls -la "$APP_DIR/"
            fi

            # Set permissions
            sudo chown -R www-data:www-data "$APP_DIR"
            sudo chmod -R 755 "$APP_DIR"

            # Clean up tarball
            rm -f "$TAR"

            # PM2 deployment (dependencies already installed in CI)
            cd "$APP_DIR"

            # Stop existing process
            pm2 stop $APP_NAME 2>/dev/null || true
            pm2 delete $APP_NAME 2>/dev/null || true

            # Start with PM2
            PORT=$APP_PORT pm2 start server.js --name $APP_NAME
            pm2 save

            echo "[INFO] PM2 started $APP_NAME on port $APP_PORT"

            # Verify
            sleep 3
            
            # Health check
            echo "[INFO] Running health check..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$APP_PORT/api/health)
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "[INFO] ✅ Health check passed (HTTP $HEALTH_STATUS)"
            else
              echo "[WARN] Health check returned HTTP $HEALTH_STATUS"
              pm2 logs $APP_NAME --lines 20 --nostream
            fi
            
            # Main application check
            APP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$APP_PORT)
            if [ "$APP_STATUS" = "200" ] || [ "$APP_STATUS" = "304" ]; then
              echo "[INFO] ✅ Application is running on port $APP_PORT"
            else
              echo "[WARN] Application returned HTTP $APP_STATUS"
            fi

            echo "[INFO] 🎉 Deployment completed!"
            echo "[INFO] Access your app at: https://privlocal.com"
